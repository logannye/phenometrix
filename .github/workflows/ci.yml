name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @phenometrix/capture-web exec playwright install --with-deps chrome
      - run: pnpm test:browser

  voice-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: uv sync --project services/voice-inference --extra dev --locked
      - run: uv run --project services/voice-inference --extra dev --locked python -m pytest services/voice-inference/tests

  encounter-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phenometrix
          POSTGRES_PASSWORD: synthetic-ci
          POSTGRES_DB: phenometrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phenometrix -d phenometrix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://phenometrix:synthetic-ci@127.0.0.1:5432/phenometrix_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres

  voicing-research-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      NUMBA_CACHE_DIR: ${{ runner.temp }}/phenometrix-numba
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # CPU binary wheels only. No local corpus, model artifacts, fitting or native builds.
      - run: >-
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
      - run: >-
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.17.1 librosa==0.11.0 pytest==8.4.2
      - working-directory: research/voice-prosody
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_voicing_robustness.py tests/test_voicing_robustness_evaluate.py
          tests/test_voicing_robustness_diagnostics.py tests/test_audit_voicing_robustness.py
          tests/test_keele_adapter.py tests/test_natural_browser.py
