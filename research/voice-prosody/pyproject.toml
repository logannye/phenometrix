[project]
name = "phenometrix-prosody"
version = "0.1.0"
description = "Reproducible offline causal voice-estimation research"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "torch==2.9.1",
  "onnx==1.19.1",
  "onnxruntime==1.23.2",
  "librosa==0.11.0",
  "torchcrepe==0.0.24",
  "torchaudio==2.9.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
